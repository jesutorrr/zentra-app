name: zentra
description: A gamified habit tracker app with clean architecture
publish_to: 'none'
version: 1.0.20+22

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Persistence
  shared_preferences: ^2.2.2
  
  # Utilities
  uuid: ^4.2.2
  intl: ^0.20.2
  google_fonts: ^6.1.0
  confetti: ^0.8.0
  crypto: ^3.0.7
  file_picker: ^10.3.7
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  
  # Animations
  flutter_animate: ^4.5.2
  
  # Charts & Visualizations
  fl_chart: ^1.1.1
  
  # Premium animations
  lottie: ^3.1.0
  rive: ^0.13.14
  
  # Loading effects
  shimmer: ^3.0.0
  
  # Notifications & Background
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.0
  flutter_timezone: ^5.0.1
  flutter_foreground_task: ^9.1.0
  
  # App Info & Device
  package_info_plus: ^9.0.0
  device_info_plus: ^12.3.0
  url_launcher: ^6.2.0
  animations: ^2.1.1
  audioplayers: ^6.5.1
  
  # Premium UX
  flutter_slidable: ^3.1.1
  smooth_page_indicator: ^1.2.0+3
  
  # Monetization
  purchases_flutter: ^8.1.0
  
  # Immutable models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "LogoZentra.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "LogoZentra.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/fonts/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
